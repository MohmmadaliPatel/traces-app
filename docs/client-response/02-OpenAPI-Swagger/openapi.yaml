  /api/conso/batch-progress:
    get:
      tags:
        - Job monitoring
      summary: Batch progress (live stream)
      description: >-
        **Server-Sent Events stream of batch progress**


        Mode: Server-Sent Events stream.


        Each event is `data: <BatchProgress JSON>` followed by a blank line; the first event is sent immediately, then one on every task
        change. A `: keepalive` comment is sent every 25 s. The server never closes the stream: close it when isComplete is true. FY /
        quarter / form are filled for conso batches (N/A for others).
      operationId: batchProgressLiveStream
      parameters:
        - name: batchId
          in: query
          required: true
          description: Batch id
          schema:
            type: integer
            description: Batch id
            example: 42
            minimum: 1
      responses:
        '200':
          description: text/event-stream; each data line is a BatchProgress object
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/BatchProgress'
              examples:
                example1:
                  summary: text/event-stream; each data line is a BatchProgress object
                  value:
                    batchId: 42
                    createdAt: '2026-10-12T08:00:00.000Z'
                    actionType: send_request
                    counts:
                      total: 4
                      queued: 1
                      inProgress: 1
                      finished: 1
                      failed: 1
                      other: 0
                    percent: 50
                    isComplete: false
                    items:
                      - taskId: 101
                        status: Finished
                        companyName: Example Deductor Pvt Ltd
                        tan: MUMB12345E
                        financialYear: 2025-26
                        quarter: Q1
                        formType: 26Q
                        errorMessage: null
                        updatedAt: '2026-10-12T08:03:11.000Z'
                      - taskId: 102
                        status: Failed
                        companyName: Example Deductor Pvt Ltd
                        tan: MUMB12345E
                        financialYear: 2025-26
                        quarter: Q2
                        formType: 26Q
                        errorMessage: TRACES login failed
                        updatedAt: '2026-10-12T08:04:02.000Z'
        '400':
          description: batchId missing or not a positive integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: batchId missing or not a positive integer
                  value:
                    error: Invalid batchId
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Missing or invalid API token
                  value:
                    error: Unauthorized
        '405':
          description: Wrong HTTP method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Wrong HTTP method
                  value:
                    error: Method not allowed
