    post:
      tags:
        - Return status
      summary: Statement status - full year
      description: >-
        **Read all 16 quarter x form statements of one FY for a company (by TAN) and save them**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes. (about 1-3 minutes)


        Uses the TRACES credentials stored on the company. financialYear is the start year ("2025"). rows in the response is a count; read
        the saved rows with getReturnStatus. HTTP 200 with success false when some combinations failed or the company is unknown.
      operationId: statementStatusFullYear
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tan
                - financialYear
              properties:
                tan:
                  type: string
                  description: Company TAN
                  example: MUMB12345E
                financialYear:
                  type: string
                  description: FY start year
                  example: '2025'
            examples:
              example1:
                summary: Statement status - full year
                value:
                  tan: MUMB12345E
                  financialYear: '2025'
      responses:
        '200':
          description: Done (check success and failedCombinations)
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - rows
                properties:
                  success:
                    type: boolean
                    description: false if any combination failed
                    example: true
                  tan:
                    type: string
                    description: TAN
                    example: MUMB12345E
                  companyName:
                    type: string
                    description: Company
                    example: Example Deductor Pvt Ltd
                  rows:
                    type: integer
                    description: Statements saved (count)
                    example: 9
                  originals:
                    type: integer
                    description: Regular statements
                    example: 7
                  emptyCombinations:
                    type: array
                    items:
                      type: string
                    description: Combinations with no statement
                    example:
                      - 24Q Q1
                  failedCombinations:
                    type: array
                    items:
                      type: object
                      properties:
                        combination:
                          type: string
                          description: e.g. 26Q Q2
                          example: 26Q Q2
                        error:
                          type: string
                          description: Reason
                          example: Timeout
                    description: Failed combinations
                  error:
                    type: string
                    description: Overall error
              examples:
                example1:
                  summary: Done (check success and failedCombinations)
                  value:
                    success: true
                    tan: MUMB12345E
                    companyName: Example Deductor Pvt Ltd
                    rows: 9
                    originals: 7
                    emptyCombinations:
                      - 24Q Q1
                      - 27Q Q1
                      - 27EQ Q1
                    failedCombinations: []
        '400':
          description: tan or financialYear missing
