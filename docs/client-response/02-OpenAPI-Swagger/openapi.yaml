  /api/challan/fetch-payment-history:
    post:
      tags:
        - Challan payment
      summary: Fetch payment history
      description: >-
        **List paid challans (CIN, amount, date) and report receipts not yet downloaded**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes. (no browser; usually seconds)


        financialYears omitted = last two FYs; [] = no FY filter. acts: O = 1961 Act, N = 2025 Act (default both). Also caches the result
        for payment-history-gaps.
      operationId: fetchPaymentHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyId
              properties:
                companyId:
                  type: integer
                  description: Company id
                  example: 1
                financialYears:
                  type: array
                  items:
                    type: string
                  description: FYs like "2026-27"
                  example:
                    - 2026-27
                acts:
                  type: array
                  items:
                    type: string
                    enum:
                      - O
                      - 'N'
                  description: Acts to read (default both)
                  example:
                    - O
                    - 'N'
                actType:
                  type: string
                  description: Single act when acts is not given
                  enum:
                    - O
                    - 'N'
            examples:
              example1:
                summary: Fetch payment history
                value:
                  companyId: 1
                  financialYears:
                    - 2026-27
                  acts:
                    - O
                    - 'N'
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - payments
                  - gaps
                properties:
                  success:
                    type: boolean
                    description: 'true'
                    example: true
                  companyName:
                    type: string
                    description: Company
                    example: Example Deductor Pvt Ltd
                  tan:
                    type: string
                    description: TAN
                    example: MUMB12345E
                  financialYears:
                    type: array
                    items:
                      type: string
                    description: FYs used
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentHistoryRow'
                    description: Payments (deduplicated by CIN)
                  gaps:
                    $ref: '#/components/schemas/PaymentHistoryGaps'
                  contentJsonPath:
                    type: string
                    description: Server cache file
                    example: ...
                  gapsJsonPath:
                    type: string
                    description: Server cache file
                    example: ...
              examples:
                example1:
                  summary: Payment history
                  value:
                    success: true
                    companyName: Example Deductor Pvt Ltd
                    tan: MUMB12345E
                    financialYears:
                      - 2026-27
                    payments:
                      - cin: 26060700012345ABCD
                        brnNum: '12345'
                        assessmentYear: 2027-28
                        paymentType: TDS/TCS Payable by Taxpayer(200)
                        minorHead: '200'
                        amount: 25000
                        paymentTime: 07-Jun-2026 16:48:27
                        crn: '26041500012345'
                        actType: 'N'
                    gaps:
                      summary:
                        totalPayments: 1
                        pdfsPresent: 0
                        pdfsMissing: 1
                        companyName: Example Deductor Pvt Ltd
                        paymentHistoryDir: /srv/app/public/pdf/challans/Example Deductor Pvt Ltd/PaymentHistory
                      present: []
                      missing:
                        - cin: 26060700012345ABCD
                          amount: 25000
                          paymentTime: 07-Jun-2026 16:48:27
                          actType: 'N'
                          pdfExists: false
                          expectedPdfPath: /srv/app/public/pdf/challans/Example Deductor Pvt Ltd/PaymentHistory/26060700012345ABCD_ChallanReceipt.pdf
                      all: []
                    contentJsonPath: /srv/app/public/pdf/challans/Example Deductor Pvt Ltd/payment_history_content.json
                    gapsJsonPath: /srv/app/public/pdf/challans/Example Deductor Pvt Ltd/payment_history_gaps.json
        '400':
          description: companyId missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: companyId missing
                  value:
                    error: Missing company ID
        '401':
          description: Missing or invalid API token
