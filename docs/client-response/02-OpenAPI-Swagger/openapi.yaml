            schema:
              type: object
              required:
                - params
              properties:
                params:
                  type: object
                  properties:
                    skip:
                      type: integer
                      description: Batch offset
                      example: 0
                    take:
                      type: integer
                      description: Batches
                      example: 10
                    orderBy:
                      type: object
                      description: 'Default { "id": "desc" }'
                    taskSkip:
                      type: integer
                      description: Task offset
                      example: 0
                    taskTake:
                      type: integer
                      description: Tasks per batch
                      example: 10
                    taskOrderBy:
                      type: object
                    taskFilters:
                      type: object
                      properties:
                        status:
                          type: array
                          items:
                            type: string
                          description: Status filter
                        companyName:
                          type: array
                          items:
                            type: string
                          description: Company filter
                meta:
                  type: object
                  description: Send {}
                  example: {}
