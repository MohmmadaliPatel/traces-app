  /api/rpc/processExcelUploadForm16:
    post:
      tags:
        - Form 16 / 16A
      summary: Form 16 / 16A
      description: >-
        **Raise or download Form 16 / 16A on TRACES (and optionally sign Form 16A PDFs)**


        Mode: Asynchronous (returns batchId).


        Asynchronous: returns a batchId immediately. Poll the Job monitoring calls (or the conso progress stream) until every task is
        Finished or Failed, then download files with GET /api/file/{path}.


        Two steps: actionType send_request raises the request on TRACES; TRACES prepares the file (minutes to hours); actionType
        download_file downloads every ready ZIP. form16Type: form16 or form16a. Form 16A new Act (form types 130/131/133) uses portalMode
        "new". actionType sign_pdf signs already generated Form 16A PDFs with the DSC on the server and returns the list of signed files
        instead of a batch.


        RPC call: body is { "params": {...}, "meta": {} }. Success is { "result": ..., "error": null }. Resolver errors (validation, not
        found, not logged in) also return HTTP 200 with "result": null and an "error" object; check "error" on every response.
      operationId: form1616A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - params
              properties:
                params:
                  type: object
                  required:
                    - companies
                    - financialYear
                    - quarter
                    - actionType
                    - jobTypes
                    - certificateName
                  properties:
                    companies:
                      type: array
                      items:
                        $ref: '#/components/schemas/CompanyCredentials'
                      description: Companies
                    financialYear:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      description: FY(s) like "2025-26"; "" for download_file
                      example: 2025-26
                    quarter:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      description: Q1-Q4; "" for download_file
                      example: Q4
                    formType:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      description: 24Q / 26Q / 27Q / 27EQ (old Act) or 130 / 131 / 133 (new Act)
                      example: 24Q
                    actionType:
                      type: string
                      description: What to do
                      example: send_request
                      enum:
                        - send_request
                        - download_file
                        - sign_pdf
                    jobTypes:
                      type: array
                      items:
                        type: string
                      description: '["SendRequest"] or ["DownloadFile"]'
                      example:
                        - SendRequest
                    sendToAllPeriods:
                      type: boolean
                      description: Queue every FY x quarter x form
                      example: false
                    form16Type:
                      type: string
                      description: form16 (default) or form16a
                      example: form16
                      enum:
                        - form16
                        - form16a
                    portalMode:
                      type: string
                      description: 'Form 16A only: new (default) = TRACES REST, old = TRACES pages'
                      example: new
                      enum:
                        - new
                        - old
                    certificateName:
                      type: string
                      description: DSC certificate name (sign_pdf); send "" otherwise
                      example: ''
                meta:
                  type: object
                  description: Send {}
                  example: {}
            examples:
              example1:
                summary: Form 16 - send request
                value:
                  params:
                    companies:
                      - name: Example Deductor Pvt Ltd
                        tan: MUMB12345E
                        it_password: '********'
                        user_id: MUMB12345E
                        password: '********'
                    financialYear: 2025-26
                    quarter: Q4
                    formType: 24Q
                    actionType: send_request
                    jobTypes:
                      - SendRequest
                    form16Type: form16
                    sendToAllPeriods: false
                    certificateName: ''
                  meta: {}
              example2:
                summary: Form 16A - send request (new Act)
                value:
                  params:
                    companies:
                      - name: Example Deductor Pvt Ltd
                        tan: MUMB12345E
                        it_password: '********'
                        user_id: MUMB12345E
                        password: '********'
                    financialYear: 2026-27
                    quarter: Q1
                    formType: '131'
                    actionType: send_request
                    jobTypes:
                      - SendRequest
                    form16Type: form16a
                    portalMode: new
                    sendToAllPeriods: false
                    certificateName: ''
                  meta: {}
              example3:
                summary: Form 16 / 16A - download ready files
                value:
                  params:
                    companies:
                      - name: Example Deductor Pvt Ltd
                        tan: MUMB12345E
                        it_password: '********'
                        user_id: MUMB12345E
                        password: '********'
                    financialYear: ''
                    quarter: ''
                    actionType: download_file
                    jobTypes:
                      - DownloadFile
                    form16Type: form16a
                    certificateName: ''
                  meta: {}
              example4:
                summary: Form 16A - sign PDFs (DSC)
                value:
                  params:
                    companies:
                      - name: Example Deductor Pvt Ltd
                        tan: MUMB12345E
                        it_password: '********'
                        user_id: MUMB12345E
                        password: '********'
                    financialYear: ''
                    quarter: ''
                    actionType: sign_pdf
                    jobTypes:
                      - SignPdf
                    form16Type: form16a
                    certificateName: Example DSC Certificate
                  meta: {}
      responses:
        '200':
          description: 'Success: result holds the data | Resolver error (still HTTP 200): result is null and error describes it'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - result
                      - error
                    properties:
                      result:
                        oneOf:
                          - $ref: '#/components/schemas/BatchCreated'
                          - type: array
                            items:
                              type: string
                            description: 'sign_pdf: paths of signed PDFs'
                      error:
                        type: object
                        nullable: true
                        description: null on success
                        example: null
                      meta:
                        type: object
                        description: Serializer metadata; ignore
                  - $ref: '#/components/schemas/RpcErrorEnvelope'
              examples:
                success:
                  summary: Success
                  value:
                    result:
                      message: Companies added to queue successfully
                      batchId: 42
                      companyCount: 1
                      taskCount: 2
                    error: null
                error:
                  summary: Error
                  value:
                    result: null
                    error:
                      name: AuthenticationError
                      message: You must be logged in to access this
                      code: null
                      statusCode: 401
                      meta: null
                      url: null
        '401':
          description: Invalid or expired API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Invalid or expired API token
                  value:
                    error: Unauthorized
        '403':
          description: Request blocked by the input-safety filter (script / HTML / CRLF patterns in the body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
              examples:
                example1:
                  summary: Request blocked by the input-safety filter (script / HTML / CRLF patterns in the body)
                  value:
                    message: Invalid request body detected
