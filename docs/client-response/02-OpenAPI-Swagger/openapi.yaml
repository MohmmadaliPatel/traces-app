                  type: integer
                  description: Company id
                  example: 1
                incomeTaxAct:
                  type: string
                  description: old (default) or new
                  example: old
                  enum:
                    - old
                    - new
                missing:
                  type: array
                  items:
                    type: object
                    required:
                      - cin
                    properties:
                      cin:
                        type: string
                        description: CIN
