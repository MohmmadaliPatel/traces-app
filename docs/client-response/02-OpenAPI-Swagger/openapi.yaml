                                          type: string
                                          description: TAN
                                          example: MUMB12345E
                            description: Rows
                          count:
                            type: integer
                            description: Total
                            example: 1
                      error:
                        type: object
                        nullable: true
                        description: null on success
                        example: null
                      meta:
                        type: object
                        description: Serializer metadata; ignore
                  - $ref: '#/components/schemas/RpcErrorEnvelope'
              examples:
                success:
                  summary: Success
                  value:
                    result:
                      returnStatus:
                        - id: 21
                          companyId: 1
