      description: >-
        **Recent batches with per-company task status**


        Mode: Database read.


        Task status: Queued → Started/In-Progress → Finished | Failed (message holds the reason).


        RPC call: body is { "params": {...}, "meta": {} }. Success is { "result": ..., "error": null }. Resolver errors (validation, not
