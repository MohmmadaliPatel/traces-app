                          type: string
                          description: FY
                          example: '2025'
                        Quarter:
                          type: string
                          description: Quarter
                          example: Q1
                        Filing Date:
                          type: string
                          description: Date
                          example: 31-Jul-2025
                    description: Rows from this run
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        companyId:
                          type: integer
                          description: Company
                          example: 1
                        companyName:
                          type: string
                          description: Company
                          example: Example Deductor Pvt Ltd
                        success:
                          type: boolean
                          description: Succeeded
                          example: true
                        rows:
                          type: array
                          items:
                            type: object
                          description: Rows
                        error:
                          type: string
                          description: Reason
                    description: Per company
                  totalRows:
                    type: integer
                    description: Rows in merged file
                    example: 154
                  jsonPath:
                    type: string
                    description: Merged JSON
                    example: /pdf/Acknowledgement/form140/form140_extract.json
                  xlsxPath:
                    type: string
                    description: Merged Excel
                    example: /pdf/Acknowledgement/form140/form140_extract.xlsx
                  message:
                    type: string
                    description: Summary
                    example: 'Done in 42.3s. Form: T140. Success: 1, Errors: 0'
              examples:
                example1:
                  summary: Extracted (success false when some companies failed)
                  value:
                    success: true
                    formTypeCd: T140
                    rows:
                      - Company Name: Example Deductor Pvt Ltd
                        TAN: MUMB12345E
                        Form Type: T140
                        Status: Verified
                        Acknowledgement No: '123456789012345'
                        RRR Number: '987654321'
                        PDF: /pdf/Acknowledgement/form140/Example_Deductor_Pvt_Ltd/2025-26/Q1/123456789012345_receipt.pdf
                        Financial Year: '2025'
                        Quarter: Q1
                        Filing Date: 31-Jul-2025
                    results:
                      - companyId: 1
                        companyName: Example Deductor Pvt Ltd
                        success: true
                        rows: []
                    totalRows: 154
                    jsonPath: /pdf/Acknowledgement/form140/form140_extract.json
                    xlsxPath: /pdf/Acknowledgement/form140/form140_extract.xlsx
                    message: 'Done in 42.3s. Form: T140. Success: 1, Errors: 0, Rows this run: 1, Total saved: 154'
        '400':
          description: No company given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFalseError'
              examples:
                example1:
                  summary: No company given
                  value:
                    success: false
                    error: Upload companies CSV or provide companyId/companyIds
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Missing or invalid API token
                  value:
                    error: Unauthorized
        '404':
          description: No companies found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFalseError'
              examples:
                example1:
                  summary: No companies found
                  value:
                    success: false
                    error: No companies found
        '405':
          description: Wrong HTTP method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFalseError'
              examples:
                example1:
                  summary: Wrong HTTP method
                  value:
                    success: false
                    error: Method not allowed
        '500':
          description: Portal automation or server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFalseError'
              examples:
                example1:
                  summary: Portal automation or server failure
                  value:
                    success: false
                    error: Failed to extract acknowledgement receipts
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tt_<32 hex>
      description: API token from Create API token
  schemas:
    Unauthorized:
      type: object
      description: Missing, invalid, expired or revoked API token.
      required:
        - error
      properties:
        error:
          type: string
          description: Always "Unauthorized"
          example: Unauthorized
    ErrorMessage:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error description
          example: Missing company ID
    SuccessFalseError:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          description: Always false
          example: false
        error:
          type: string
          description: Error description
          example: Failed to run challan status
    SuccessFalseMessage:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Always false
          example: false
        message:
          type: string
          description: Error description
          example: Missing required parameters
    FileError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error description
          example: File not found
    PortalCredentials:
      type: object
      description: TRACES login of the deductor. All three fields are required and must be non-empty.
      required:
        - userId
        - password
        - tan
      properties:
        userId:
          type: string
          description: TRACES user ID of the deductor
          example: MUMB12345E
        password:
          type: string
          description: TRACES password
          example: '********'
          format: password
        tan:
          type: string
          description: TAN (10 characters)
          example: MUMB12345E
    CompanyCredentials:
      type: object
      description: >-
        Company row used by the batch (async) jobs. A company not yet in the system is created; an existing one has its name and credentials
        updated.
      required:
        - name
        - tan
        - it_password
        - user_id
        - password
      properties:
        name:
          type: string
          description: Deductor / company name (used for output folder names)
          example: Example Deductor Pvt Ltd
        tan:
          type: string
          description: TAN; the company is created or updated by TAN
          example: MUMB12345E
        it_password:
          type: string
          description: Income Tax e-filing portal password
          example: '********'
          format: password
        user_id:
          type: string
          description: TRACES user ID
          example: MUMB12345E
        password:
          type: string
          description: TRACES password
          example: '********'
          format: password
    RpcError:
      type: object
      description: Error thrown inside an RPC resolver. Returned with HTTP 200 inside the RPC envelope.
      required:
        - name
        - message
        - statusCode
      properties:
        name:
          type: string
          description: Error class
          example: AuthenticationError
          enum:
            - AuthenticationError
            - NotFoundError
            - ZodError
            - PaginationArgumentError
            - Error
        message:
          type: string
          description: Error message. For ZodError this is a JSON string of the validation issues.
          example: You must be logged in to access this
        code:
          type: string
          description: Prisma error code when applicable
          example: null
          nullable: true
        statusCode:
          type: integer
          description: Logical status (the HTTP status of the response is still 200)
          example: 401
        meta:
          type: object
          description: Extra error data (e.g. Prisma target)
          nullable: true
        url:
          type: string
          description: Unused
          example: null
          nullable: true
    RpcErrorEnvelope:
      type: object
      description: RPC failure. HTTP status is 200; check `error`.
      required:
        - result
        - error
      properties:
        result:
          type: object
          description: Always null on error
          example: null
          nullable: true
        error:
          $ref: '#/components/schemas/RpcError'
        meta:
          type: object
          description: Serializer metadata; ignore
    TldcRecord:
      type: object
      description: LDC certificate in the client field set.
      required:
        - id
        - companyId
        - act
        - fy
        - certNumber
        - pan
        - section
        - isActive
      properties:
        id:
          type: integer
          description: Internal row id
          example: 11
        companyId:
          type: integer
          description: Deductor company id
          example: 1
        act:
          type: string
          description: 'Income-tax Act: old = 1961 (FY up to 2025-26), new = 2025 (tax year 2026-27 onwards)'
          example: new
          enum:
            - old
            - new
        fy:
          type: string
          description: Financial / tax year
          example: 2026-27
        certNumber:
          type: string
          description: Certificate number (update key with companyId + fy)
          example: 4AD0426ILB4A140
        din:
          type: string
          description: 'Old Act: DIN in the 197 inbox. New Act: parent certificate number. Reference only.'
          example: 4AD0426ILB
        pan:
          type: string
          description: Deductee PAN
          example: ABCDE1234F
        panName:
          type: string
          description: Deductee name
          example: EXAMPLE VENDOR LLP
        section:
          type: string
          description: Section code as returned by TRACES (old e.g. 94J, new e.g. 1027)
          example: '1027'
        sectionDesc:
          type: string
          description: Statutory section for the code
          example: '393(1) [Table: Sl. No. 6(iii).D(b)]'
          nullable: true
        natureOfPayment:
          type: string
          description: Nature of payment as shown on TRACES (not taken from the PDF)
          example: Any sum by way of (a) fees for professional services ...
        tdsRate:
          type: number
          description: TDS rate % as per certificate
          example: 3
        tdsAmountLimit:
          type: number
          description: Certificate limit (INR)
          example: 900000
        tdsAmountConsumed:
          type: number
          description: Amount consumed as per TRACES (INR)
          example: 0
        tdsAmountBalance:
          type: number
          description: limit - consumed, minimum 0 (INR)
          example: 900000
        issueDate:
          type: string
          description: Date of issue, DD-MM-YYYY (IST)
          example: 20-03-2026
          nullable: true
        validFrom:
          type: string
          description: Valid from, DD-MM-YYYY (IST)
          example: 24-04-2026
          nullable: true
        validTo:
          type: string
          description: Valid to, DD-MM-YYYY (IST)
          example: 31-03-2027
          nullable: true
        cancelDate:
          type: string
          description: Cancellation (valid-till) date, DD-MM-YYYY (IST). Old Act only; null for new Act.
          example: null
          nullable: true
        isActive:
          type: boolean
          description: false = cancelled on TRACES
          example: true
        pdfUrl:
          type: string
          description: GET this path with the same Bearer token to download the certificate PDF; null until TRACES has prepared it
          example: /api/file/pdf/child-certificates/Example%20Deductor%20Pvt%20Ltd/298942.pdf
          nullable: true
        lastSyncedAt:
          type: string
          description: When the row was last written from TRACES (ISO-8601 UTC)
          example: '2026-07-30T11:05:36.144Z'
          format: date-time
    TldcWarning:
      type: object
      description: Per-certificate problem in an otherwise successful run.
      required:
        - certNumber
        - errorCode
        - message
      properties:
        certNumber:
          type: string
          description: Certificate concerned
          example: 4AD0426ILB4A141
        errorCode:
          type: string
          description: Warning code
          example: LDC_CERT_DETAIL_FAILED
          enum:
            - LDC_CERT_NOT_FOUND
            - LDC_CERT_DETAIL_FAILED
        message:
          type: string
          description: Details
          example: Certificate detail unavailable; saved from search results only
    TldcError:
      type: object
      description: Error returned by every LDC endpoint (HTTP 400/401/404/5xx).
      required:
        - success
        - errorCode
        - message
        - retryable
      properties:
        success:
          type: boolean
          description: Always false
          example: false
        errorCode:
          type: string
          description: Error code (see LDC error catalogue)
          example: LDC_AUTH_INVALID
          enum:
            - LDC_INVALID_INPUT
            - LDC_COMPANY_NOT_FOUND
            - LDC_AUTH_INVALID
            - LDC_CAPTCHA_FAILED
            - LDC_CAPTCHA_SERVICE_UNAVAILABLE
            - LDC_SESSION_EXPIRED
            - LDC_PORTAL_UNAVAILABLE
            - LDC_TIMEOUT
            - LDC_PDF_DOWNLOAD_FAILED
            - LDC_INTERNAL_ERROR
        message:
          type: string
          description: Human-readable message
          example: 'TRACES login failed (non-retryable): ... Invalid User ID / Password'
        retryable:
          type: boolean
          description: true if the same call can succeed later without changes
          example: false
    BatchCreated:
      type: object
      required:
        - message
        - batchId
        - companyCount
        - taskCount
      properties:
        message:
          type: string
          description: Confirmation
          example: Companies added to queue successfully
        batchId:
          type: integer
          description: Batch id; use with the job-monitoring calls
          example: 42
        companyCount:
          type: integer
          description: Companies in the request
          example: 1
        taskCount:
          type: integer
          description: Tasks queued (companies x periods)
          example: 2
    BatchProgressItem:
      type: object
      required:
        - taskId
        - status
        - companyName
        - tan
      properties:
        taskId:
          type: integer
          description: Task id
          example: 101
        status:
          type: string
          description: Task status
          example: Finished
          enum:
            - Queued
            - Started/In-Progress
            - Finished
            - Failed
            - Cancelled
            - Removed
        companyName:
          type: string
          description: Company
          example: Example Deductor Pvt Ltd
        tan:
          type: string
          description: TAN
          example: MUMB12345E
        financialYear:
          type: string
          description: FY of this task, or N/A
          example: 2025-26
        quarter:
          type: string
          description: Quarter of this task, or N/A
          example: Q1
        formType:
          type: string
          description: Form type of this task, or N/A
          example: 26Q
        errorMessage:
          type: string
          description: Failure reason
          example: null
          nullable: true
        updatedAt:
          type: string
          description: Last update (ISO)
          example: '2026-10-12T08:03:11.000Z'
          format: date-time
    BatchProgress:
      type: object
      description: Progress of an async batch. An unknown batchId returns zero counts and an empty items list.
      required:
        - batchId
        - counts
        - percent
        - isComplete
        - items
      properties:
        batchId:
          type: integer
          description: Batch id
          example: 42
        createdAt:
          type: string
          description: Batch creation time (ISO); null if the batch does not exist
          example: '2026-10-12T08:00:00.000Z'
          format: date-time
          nullable: true
        actionType:
          type: string
          description: send_request / download_file / sign_pdf
          example: send_request
          nullable: true
        counts:
          type: object
          required:
            - total
            - queued
            - inProgress
            - finished
            - failed
            - other
          properties:
            total:
              type: integer
              description: All tasks
              example: 4
            queued:
              type: integer
              description: Queued
              example: 1
            inProgress:
              type: integer
              description: Running
              example: 1
            finished:
              type: integer
              description: Finished
              example: 1
            failed:
              type: integer
              description: Failed
              example: 1
            other:
              type: integer
              description: Cancelled / removed
              example: 0
        percent:
          type: integer
          description: (finished + failed) / total x 100, rounded
          example: 50
        isComplete:
          type: boolean
          description: true when every task is finished or failed
          example: false
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchProgressItem'
          description: One entry per task, ordered by taskId
    RetryResult:
      type: object
      required:
        - success
        - retriedCount
        - taskIds
        - message
      properties:
        success:
          type: boolean
          description: Always true
          example: true
        retriedCount:
          type: integer
          description: Tasks re-queued
          example: 1
        taskIds:
          type: array
          items:
            type: integer
          description: Re-queued task ids
          example:
            - 102
        actionType:
          type: string
          description: Batch action (conso / justification only)
          example: send_request
          nullable: true
        message:
          type: string
          description: Summary
          example: Queued 1 failed task(s) for retry
    ChallanCreateResult:
      type: object
      required:
        - sectionCode
        - amount
        - success
      properties:
        sectionCode:
          type: string
          description: Section code sent
          example: 94C
        sectionDesc:
          type: string
          description: Section number from the code table (empty on old-Act failure)
          example: 194C
        amount:
          type: string
          description: Amount sent
          example: '25000'
        success:
          type: boolean
          description: Challan created for this section
          example: true
        pymntRefNum:
          type: string
          description: Payment reference number (PRN), when created
          example: '26041500012345'
        error:
          type: string
          description: Failure reason, when not created
    PaymentHistoryRow:
      type: object
      description: Payment-history row as returned by the e-Pay portal (extra portal keys may appear).
      required:
        - cin
      properties:
        cin:
          type: string
          description: Challan identification number
          example: 26060700012345ABCD
        brnNum:
          type: string
          description: Bank reference number
          example: '12345'
        assessmentYear:
          type: string
          description: Assessment / tax year
          example: 2027-28
        paymentType:
          type: string
          description: Payment type
          example: TDS/TCS Payable by Taxpayer(200)
        minorHead:
          type: string
          description: Minor head
          example: '200'
        minorDesc:
          type: string
          description: Minor head description
          example: TDS/TCS Payable by Taxpayer
        amount:
          type: number
          description: Amount (INR)
          example: 25000
        paymentTime:
          type: string
          description: Payment time as shown on e-Pay
          example: 07-Jun-2026 16:48:27
        crn:
          type: string
          description: Challan reference number
          example: '26041500012345'
        tileId:
          type: string
          description: Portal tile id
          example: TDS
        actType:
          type: string
          description: O = Income-tax Act 1961, N = Income-tax Act 2025
          example: 'N'
          enum:
            - O
            - 'N'
    PaymentHistoryRowWithPdf:
      allOf:
        - $ref: '#/components/schemas/PaymentHistoryRow'
        - type: object
          properties:
            pdfExists:
              type: boolean
              description: Receipt PDF already downloaded
              example: false
            expectedPdfPath:
              type: string
              description: Server path of the receipt PDF
              example: .../PaymentHistory/26060700012345ABCD_ChallanReceipt.pdf
            challanStatusInExcel:
              type: boolean
              description: Present in the TRACES challan-status Excel (payment-history-gaps only)
              example: null
              nullable: true
    PaymentHistoryGaps:
      type: object
      required:
        - summary
        - present
        - missing
      properties:
        summary:
          type: object
          properties:
            totalPayments:
              type: integer
              description: Payments
              example: 12
            pdfsPresent:
              type: integer
              description: Receipts present
              example: 10
            pdfsMissing:
              type: integer
              description: Receipts missing
              example: 2
            companyName:
              type: string
              description: Company
              example: Example Deductor Pvt Ltd
            paymentHistoryDir:
              type: string
              description: Server folder
              example: .../PaymentHistory
        present:
          type: array
          items:
            $ref: '#/components/schemas/PaymentHistoryRowWithPdf'
          description: Payments whose receipt is present
        missing:
          type: array
          items:
            $ref: '#/components/schemas/PaymentHistoryRowWithPdf'
          description: Payments whose receipt is missing
        all:
          type: array
          items:
            $ref: '#/components/schemas/PaymentHistoryRowWithPdf'
          description: All payments
        fetchedAt:
          type: string
          description: When the cache was written (cached reads only)
          example: '2026-10-10T09:12:00.000Z'
        financialYears:
          type: array
          items:
            type: string
          description: FY filter used (cached reads only)
          example:
            - 2026-27
    DownloadStats:
      type: object
      required:
        - totalSeen
        - skipped
        - downloaded
        - pages
      properties:
        totalSeen:
          type: integer
          description: Rows seen on the portal
          example: 48
        skipped:
          type: integer
          description: Already downloaded
          example: 40
        downloaded:
          type: integer
          description: Downloaded now
          example: 8
        pages:
          type: integer
          description: Grid pages read
          example: 1
    TargetedDownloadStats:
      allOf:
        - $ref: '#/components/schemas/DownloadStats'
        - type: object
          properties:
            matched:
              type: integer
              description: Targets matched
              example: 2
            notFound:
              type: integer
              description: Targets not found
              example: 1
            failed:
              type: integer
              description: Downloads failed
              example: 0
    MissingPdfResult:
      allOf:
        - $ref: '#/components/schemas/DownloadStats'
        - type: object
          properties:
            dateRangesProcessed:
              type: integer
              description: 0 or 1
              example: 1
            stillMissing:
              type: integer
              description: Receipts still missing
              example: 0
            dayGroups:
              type: array
              items:
                type: object
                properties:
                  dayKey:
                    type: string
                    description: Date range
                    example: 06-Jun-2026_to_08-Jul-2026
                  count:
                    type: integer
                    description: Receipts
                    example: 4
              description: Date ranges used
            downloadedCins:
              type: array
              items:
                type: string
              description: CINs downloaded in this run
              example:
                - 26060700012345ABCD
    CoverageReport:
      type: object
      required:
        - companyName
        - inExcel
        - notInExcel
      properties:
        companyName:
          type: string
          description: Company
          example: Example Deductor Pvt Ltd
        excelPath:
          type: string
          description: Challan-status Excel path
          example: .../challan_status_results/Example Deductor Pvt Ltd_challan_status.xlsx
        excelExists:
          type: boolean
          description: Excel present
          example: true
        excelRowCount:
          type: integer
          description: Rows in Excel
          example: 30
        totalPdfsParsed:
          type: integer
          description: Receipts parsed
          example: 10
        inExcel:
          type: integer
          description: Receipts found in Excel
          example: 9
        notInExcel:
          type: integer
          description: Receipts not in Excel
          example: 1
        checkedAt:
          type: string
          description: When checked (ISO)
          example: '2026-10-10T09:15:00.000Z'
        items:
          type: array
          items:
            type: object
            properties:
              cin:
                type: string
                description: CIN
                example: 26060700012345ABCD
              bsr:
                type: string
                description: BSR code
                example: '0510308'
              csn:
                type: string
                description: Challan serial no.
                example: '05488'
              challanAmount:
                type: number
                description: Amount
                example: 25000
              date:
                type: string
                description: Deposit date
                example: 07-Jun-2026
              pdfFileName:
                type: string
                description: Receipt file
                example: 26060700012345ABCD_ChallanReceipt.pdf
              pdfPath:
                type: string
                description: Server path
                example: ...
              inChallanStatusExcel:
                type: boolean
                description: Found in Excel
                example: true
          description: One entry per parsed receipt
    ReturnStatusRow:
      type: object
      required:
        - finyear
        - quarter
        - formtype
        - tokenno
        - dtoffiling
        - status
      properties:
        finyear:
          type: string
          description: Financial year as shown on TRACES
          example: 2025-26
        quarter:
          type: string
          description: Quarter as shown on TRACES
          example: Q1
        formtype:
          type: string
          description: Form
          example: 26Q
        tokenno:
          type: string
          description: Token / RRR number (masked by TRACES)
          example: 7700XXXXXXX8491
        dtoffiling:
          type: string
          description: Date of filing
          example: 31-Jul-2025
        status:
          type: string
          description: Statement status
          example: Processed with Defaults
        dtofprcng:
          type: string
          description: Date of processing
          example: 05-Aug-2025
        stmnttype:
          type: string
          description: Regular or Correction
          example: Regular
        remarks:
          type: string
          description: Remarks
          example: null
          nullable: true
        reason:
          type: string
          description: Reason
          example: null
          nullable: true
        rejectionMsg:
          type: string
          description: Rejection reason (rejected statements only)
    DemandRow:
      type: object
      required:
        - finYr
        - aodmnd
        - cpcdmd
      properties:
        finYr:
          type: string
          description: Financial year
