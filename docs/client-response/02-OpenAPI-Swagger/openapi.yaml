openapi: 3.0.3
info:
  title: Taxteck TRACES / Income Tax Portal API
  version: 1.1.0
  description: >-
    APIs for LDC (lower deduction certificates) and TDS on Expense: challans, unconsumed challans, Form 16 / 16A, conso, justification,
    statement status, demand and certificate extraction.


    **Authentication:** every call needs `Authorization: Bearer <api token>` (create one with Login + Create API token). Do not keep a
    cookie jar for API calls.


    **Two call styles:** REST endpoints take plain JSON. RPC endpoints (`/api/rpc/*`) take `{ "params": {...}, "meta": {} }` and answer `{
    "result": ..., "error": null }`; resolver errors come back with HTTP 200 and an `error` object.


    **Modes:** synchronous portal calls stay open until done (allow at least 15 minutes); asynchronous calls return a `batchId` to poll;
    database reads return in under a second.


    **LDC errors:** `{ success: false, errorCode, message, retryable }`.
servers:
  - url: http://localhost:3000
    description: Local / on-premise server (replace with your host)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: LDC
  - name: Challan payment
  - name: Companies
  - name: Import challans
  - name: Form 16 / 16A
  - name: Conso file
  - name: Justification report
  - name: Job monitoring
  - name: Files
  - name: Challan verification
  - name: Return status
  - name: Demand
  - name: Certificate extraction
  - name: Exports
  - name: Other extracts
