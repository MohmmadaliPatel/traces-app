  /api/rpc/generateForm16PdfsFromZips:
    post:
      tags:
        - Certificate extraction
      summary: Generate Form 16 / 16A PDFs from ZIPs
      description: >-
        **Convert TRACES Form 16 / 16A ZIPs into PDFs (TRACES PDF Converter logic)**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        sourceFolder is a folder on the server holding the TRACES ZIPs (normally the Form 16 / 16A download folder). The ZIP password is the
        TAN. Writes one PDF per deductee (Form 16A) to public/pdf/form16a/{Company}/{form}_FY{fy}_{quarter}/ plus an Excel to
        public/pdf/traces_excel/{Company}/. Processing problems come back as success false with errors[] (not an RPC error).


        RPC call: body is { "params": {...}, "meta": {} }. Success is { "result": ..., "error": null }. Resolver errors (validation, not
        found, not logged in) also return HTTP 200 with "result": null and an "error" object; check "error" on every response.
      operationId: generateForm1616APDFsFromZIPs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - params
              properties:
                params:
                  type: object
                  required:
                    - sourceFolder
                    - companyName
                    - tan
                    - financialYear
                    - quarter
                    - formType
                    - form16Type
                  properties:
                    sourceFolder:
                      type: string
                      description: Server folder with the ZIPs
                      example: public/pdf/form16a-download/Example Deductor Pvt Ltd
                    companyName:
                      type: string
                      description: Company name
                      example: Example Deductor Pvt Ltd
                    tan:
                      type: string
                      description: TAN (ZIP password)
                      example: MUMB12345E
                    financialYear:
                      type: string
                      description: FY
                      example: 2026-27
                    quarter:
                      type: string
                      description: Quarter
                      example: Q1
                    formType:
                      type: string
                      description: 26Q / 27Q / 130 / 131 / 133 ...
                      example: '131'
                    form16Type:
                      type: string
                      description: form16 or form16a
                      example: form16a
                      enum:
                        - form16
                        - form16a
                    skipExisting:
                      type: boolean
                      description: Skip PDFs that already exist (default true)
                      example: true
                meta:
                  type: object
                  description: Send {}
                  example: {}
            examples:
              example1:
                summary: Generate Form 16 / 16A PDFs from ZIPs
                value:
                  params:
                    sourceFolder: public/pdf/form16a-download/Example Deductor Pvt Ltd
                    companyName: Example Deductor Pvt Ltd
                    tan: MUMB12345E
                    financialYear: 2026-27
                    quarter: Q1
                    formType: '131'
                    form16Type: form16a
                    skipExisting: true
                  meta: {}
      responses:
        '200':
          description: 'Success: result holds the data | Resolver error (still HTTP 200): result is null and error describes it'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - result
                      - error
                    properties:
                      result:
                        type: object
                        required:
                          - success
                          - processedZips
                          - generatedPdfs
                          - errors
                          - message
                        properties:
                          success:
                            type: boolean
                            description: At least one ZIP processed without error
                            example: true
                          processedZips:
                            type: integer
                            description: ZIPs
                            example: 2
                          generatedPdfs:
                            type: integer
                            description: PDFs generated
                            example: 148
                          skippedPdfs:
                            type: integer
                            description: Existing PDFs skipped
                            example: 0
                          generatedExcel:
                            type: string
                            description: Excel written
                            example: ...
                          outputDir:
                            type: string
                            description: PDF folder
                            example: ...
                          errors:
                            type: array
                            items:
                              type: string
                            description: Problems per ZIP
                          message:
                            type: string
                            description: Summary
                            example: Processed 2 zip(s). Generated 148 PDF(s).
                          logs:
                            type: array
                            items:
                              type: string
                            description: Processing log
                      error:
                        type: object
                        nullable: true
                        description: null on success
                        example: null
                      meta:
                        type: object
                        description: Serializer metadata; ignore
                  - $ref: '#/components/schemas/RpcErrorEnvelope'
              examples:
                success:
                  summary: Success
                  value:
                    result:
                      success: true
                      processedZips: 2
                      generatedPdfs: 148
                      skippedPdfs: 0
                      generatedExcel: /srv/app/public/pdf/traces_excel/Example Deductor Pvt Ltd/MUMB12345E_131_Q1.xlsx
                      outputDir: /srv/app/public/pdf/form16a/Example Deductor Pvt Ltd/131_FY2026-27_Q1
                      errors: []
                      message: Processed 2 zip(s). Generated 148 PDF(s).
                      logs:
                        - Found 2 zip file(s)
                    error: null
                error:
                  summary: Error
                  value:
                    result: null
                    error:
                      name: AuthenticationError
                      message: You must be logged in to access this
                      code: null
                      statusCode: 401
                      meta: null
                      url: null
        '401':
          description: Invalid or expired API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Invalid or expired API token
                  value:
                    error: Unauthorized
        '403':
          description: Request blocked by the input-safety filter (script / HTML / CRLF patterns in the body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
              examples:
                example1:
                  summary: Request blocked by the input-safety filter (script / HTML / CRLF patterns in the body)
                  value:
                    message: Invalid request body detected
