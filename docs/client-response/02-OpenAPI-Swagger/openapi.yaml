  /api/file/{slug}:
    get:
      tags:
        - Files
      summary: Download file (ZIP / PDF / Excel)
      description: >-
        **Download any file produced by the APIs (path relative to public/)**


        Mode: File download.


        slug is the file path under public/, e.g. pdf/traces/{Company}/{file}.zip. URL-encode spaces. Folders: conso & justification ZIPs
        pdf/traces/{Company}/, conso Excel pdf/traces_excel/{Company}/, Form 16 pdf/form16-download/, Form 16A pdf/form16a-download/ and
        pdf/form16a/{Company}/, LDC certificates: use records[].pdfUrl, challan receipts pdf/challans/{Company}/PaymentHistory/.
      operationId: downloadFileZIPPDFExcel
      parameters:
        - name: slug
          in: path
          required: true
          description: File path under public/ (slashes allowed)
          schema:
            type: string
            description: File path under public/
            example: pdf/traces/Example Deductor Pvt Ltd/MUMB12345E_26Q_Q1_2026-27.zip
          allowReserved: true
      responses:
        '200':
          description: File bytes; Content-Type from the file extension (application/pdf, application/zip, Excel, ...)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Missing path, or path outside public/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
              examples:
                example1:
                  summary: Missing path, or path outside public/
                  value:
                    message: Invalid file path
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Missing or invalid API token
                  value:
                    error: Unauthorized
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
              examples:
                example1:
                  summary: File not found
                  value:
                    message: File not found
  /api/challan/download-csi:
    post:
      tags:
        - Challan verification
      summary: Download CSI file
      description: >-
        **Download the Challan Status Inquiry (CSI) file from e-Pay**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        The CSI file is what the return preparation utility uses to verify challans (BSR code, date, serial number, amount). Dates
        DD-Mon-YYYY. Saved to public/pdf/challans/{Company}/CSI/.
      operationId: downloadCSIFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyId
                - fromDate
                - toDate
              properties:
                companyId:
                  type: integer
                  description: Company id
                  example: 1
                fromDate:
                  type: string
                  description: From date DD-Mon-YYYY
                  example: 01-Apr-2026
                toDate:
                  type: string
                  description: To date DD-Mon-YYYY
                  example: 30-Jun-2026
                incomeTaxAct:
                  type: string
                  description: old (default) or new
                  example: new
                  enum:
                    - old
                    - new
            examples:
              example1:
                summary: Download CSI file
                value:
                  companyId: 1
                  fromDate: 01-Apr-2026
                  toDate: 30-Jun-2026
                  incomeTaxAct: new
      responses:
        '200':
          description: Downloaded
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - result
                properties:
                  success:
                    type: boolean
                    description: 'true'
                    example: true
                  result:
                    type: object
                    properties:
                      downloadPath:
                        type: string
                        description: Server folder
                        example: ...
                      files:
                        type: array
                        items:
                          type: string
                        description: CSI file names
              examples:
                example1:
                  summary: Downloaded
                  value:
                    success: true
                    result:
                      downloadPath: /srv/app/public/pdf/challans/Example Deductor Pvt Ltd/CSI
                      files:
                        - MUMB12345E_01042026_30062026.csi
        '400':
          description: companyId or dates missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: companyId or dates missing
                  value:
                    error: From date and to date are required for CSI download
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Missing or invalid API token
                  value:
                    error: Unauthorized
        '404':
          description: Unknown companyId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Unknown companyId
                  value:
                    error: Company not found
        '405':
          description: Wrong HTTP method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Wrong HTTP method
                  value:
                    error: Method not allowed
        '500':
          description: Portal automation or server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Portal automation or server failure
                  value:
                    error: CSI file download did not complete within 60s
  /api/return-status/fetch:
    post:
      tags:
        - Return status
      summary: Fetch statement status
      description: >-
        **Read TRACES Statement Status (token, filing date, status) and save it**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        Every financialYears x quarters x formTypes combination is read. financialYears are start years ("2025" = FY 2025-26). quarters are
        TRACES codes: "3" = Q1, "4" = Q2, "5" = Q3, "6" = Q4. Combinations without a statement are left out. Saved per company + FY +
        quarter + form + token.
      operationId: fetchStatementStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyId
                - credentials
                - financialYears
                - quarters
                - formTypes
              properties:
                companyId:
                  type: integer
                  description: Company id
                  example: 1
                credentials:
                  $ref: '#/components/schemas/PortalCredentials'
                financialYears:
                  type: array
                  items:
                    type: string
                  description: FY start years
                  example:
                    - '2025'
                quarters:
                  type: array
                  items:
                    type: string
                    enum:
                      - '3'
                      - '4'
                      - '5'
                      - '6'
                  description: 3=Q1, 4=Q2, 5=Q3, 6=Q4
                  example:
                    - '3'
                    - '4'
                formTypes:
                  type: array
                  items:
                    type: string
                    enum:
                      - 24Q
                      - 26Q
                      - 27Q
                      - 27EQ
                  description: Forms
                  example:
                    - 24Q
                    - 26Q
            examples:
              example1:
                summary: Fetch statement status
                value:
                  companyId: 1
                  credentials:
                    userId: MUMB12345E
                    password: '********'
                    tan: MUMB12345E
                  financialYears:
                    - '2025'
                  quarters:
                    - '3'
                    - '4'
                  formTypes:
                    - 24Q
                    - 26Q
      responses:
        '200':
          description: Statement status saved
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - saved
                  - updated
                properties:
                  success:
                    type: boolean
                    description: 'true'
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        financialYear:
                          type: string
                          description: Requested FY start year
                          example: '2025'
                        quarter:
                          type: string
                          description: Requested quarter code
                          example: '3'
                        formType:
                          type: string
                          description: Requested form
                          example: 26Q
                        data:
                          type: object
                          properties:
                            rows:
                              type: array
                              items:
                                $ref: '#/components/schemas/ReturnStatusRow'
                              description: Statements
                            totalPages:
                              type: integer
                              description: Pages
                              example: 1
                            totalRecords:
                              type: integer
                              description: Records
                              example: 1
                    description: Per combination with statements
                  saved:
                    type: integer
                    description: Rows inserted
                    example: 1
                  updated:
                    type: integer
                    description: Rows updated
                    example: 0
                  errors:
                    type: integer
                    description: Rows that failed to save
                    example: 0
                  message:
                    type: string
                    description: Summary
                    example: 'Successfully fetched and saved return status data. Saved: 1, Updated: 0'
              examples:
                example1:
                  summary: Statement status saved
                  value:
                    success: true
                    data:
                      - financialYear: '2025'
                        quarter: '3'
                        formType: 26Q
                        data:
                          rows:
                            - finyear: 2025-26
                              quarter: Q1
                              formtype: 26Q
                              tokenno: 7700XXXXXXX8491
                              dtoffiling: 31-Jul-2025
                              status: Processed with Defaults
                              dtofprcng: 05-Aug-2025
                              stmnttype: Regular
                              remarks: null
                              reason: null
                          totalPages: 1
                          totalRecords: 1
                    saved: 1
                    updated: 0
                    errors: 0
                    message: 'Successfully fetched and saved return status data. Saved: 1, Updated: 0'
        '400':
          description: Missing parameters, or no statement found for any combination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFalseMessage'
              examples:
                example1:
                  summary: Missing parameters, or no statement found for any combination
                  value:
                    success: false
                    message: No data received from portal
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Missing or invalid API token
                  value:
                    error: Unauthorized
        '405':
          description: Wrong HTTP method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Wrong HTTP method
                  value:
                    error: Method not allowed
        '500':
          description: Portal automation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessFalseMessage'
              examples:
                example1:
                  summary: Portal automation failure
                  value:
                    success: false
                    message: TRACES login failed
