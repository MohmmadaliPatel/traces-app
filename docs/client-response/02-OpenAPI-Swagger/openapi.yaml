  /api/tldc/fetch-data:
    post:
      tags:
        - LDC
      summary: Fetch certificates - Old Act
      description: >-
        **Fetch LDC certificates from TRACES (Income-tax Act 1961, FY up to 2025-26)**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        Reads the TRACES 197 inbox, downloads each new certificate PDF (kept as certificates/{certNumber}.pdf), then verifies every
        certificate on the 197 certificate verification page (section, nature, rate, limit, consumed, dates, cancellation). A certificate
        with a cancel date is saved with isActive=false. Certificates already stored for the company and FY are not downloaded again.
      operationId: fetchCertificatesOldAct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tan
                - year
                - companyId
                - credentials
              properties:
                tan:
                  type: string
                  description: Deductor TAN
                  example: MUMB12345E
                year:
                  type: string
                  description: 'FY start year: "2024" for 2024-25'
                  example: '2024'
                companyId:
                  type: integer
                  description: Company id
                  example: 1
                credentials:
                  $ref: '#/components/schemas/PortalCredentials'
            examples:
              example1:
                summary: Fetch certificates - Old Act
                value:
                  tan: MUMB12345E
                  year: '2024'
                  companyId: 1
                  credentials:
                    userId: MUMB12345E
                    password: '********'
                    tan: MUMB12345E
      responses:
        '200':
          description: Fetched and saved
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - records
                  - warnings
                  - message
                properties:
                  success:
                    type: boolean
                    description: 'true'
                    example: true
                  data:
                    type: object
                    description: Raw download result
                    properties:
                      success:
                        type: boolean
                        description: Download step completed
                        example: true
                      totalDownloaded:
                        type: integer
                        description: Certificates processed
                        example: 1
                      totalPages:
                        type: integer
                        description: Inbox pages read
                        example: 1
                      partialDownload:
                        type: boolean
                        description: Present when the run stopped early
                      errorMessage:
                        type: string
                        description: Present with partialDownload
