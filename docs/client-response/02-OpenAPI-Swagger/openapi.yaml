                      paymentTime:
                        type: string
                        description: e.g. 07-Jun-2026 16:48:27
                        example: 07-Jun-2026 16:48:27
                      assessmentYear:
                        type: string
                        description: Year
                        example: 2027-28
                      paymentType:
                        type: string
                        description: Type
                      actType:
                        type: string
                        description: O / N
