  /api/challan/download-missing-payment-pdfs:
    post:
      tags:
        - Challan payment
      summary: Download missing payment receipts
      description: >-
        **Download only the receipts reported missing by Fetch payment history**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        Old Act: uses the missing list from the last Fetch payment history (or the missing array you send). New Act: downloads every receipt
        not yet present. Also refreshes the challan-status coverage check.
