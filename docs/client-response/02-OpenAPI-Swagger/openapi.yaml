                      status:
                        - Queued
                        - Started/In-Progress
                        - Finished
                        - Failed
                  meta: {}
      responses:
        '200':
          description: 'Success: result holds the data | Resolver error (still HTTP 200): result is null and error describes it'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
