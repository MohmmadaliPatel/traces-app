              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    description: Reason
                    example: Select at least one financial year
                  listExcelPath:
                    type: string
                    description: Expected Excel (list missing)
              examples:
                example1:
                  summary: companyId / financialYears missing, or the unconsumed list has not been fetched
                  value:
                    error: Select at least one financial year
