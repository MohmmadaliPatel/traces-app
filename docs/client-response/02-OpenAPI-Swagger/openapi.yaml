  /api/tldc/list:
    post:
      tags:
        - LDC
      summary: List stored certificates
      description: >-
        **List stored LDC certificates (database only, no TRACES call)**


        Mode: Database read.


        Fast read for TOE screens; no TRACES login or captcha. Provide companyId or tan. Ordered by FY (newest first) then certificate
        number. Each record carries pdfUrl for its PDF.
      operationId: listStoredCertificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyId:
                  type: integer
                  description: Company id (takes precedence over tan)
                  example: 1
                tan:
                  type: string
                  description: TAN, instead of companyId
                fy:
                  type: string
                  description: '"2026-27" or "2026"'
                  example: 2026-27
                act:
                  type: string
                  description: old or new
                  example: new
                  enum:
                    - old
                    - new
                certNumber:
                  type: string
                  description: Exact certificate number
                pan:
                  type: string
                  description: Exact deductee PAN
                isActive:
                  type: boolean
                  description: true = active, false = cancelled
                  example: true
                skip:
                  type: integer
                  description: Paging offset
                  example: 0
                  minimum: 0
                take:
                  type: integer
                  description: Page size (max 5000)
                  example: 1000
                  minimum: 1
                  maximum: 5000
            examples:
              example1:
                summary: List stored certificates
                value:
                  companyId: 1
                  fy: 2026-27
                  act: new
                  isActive: true
                  skip: 0
                  take: 1000
              example2:
                summary: List stored certificates by TAN
                value:
                  tan: MUMB12345E
      responses:
        '200':
          description: Certificates
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - company
                  - count
                  - records
                properties:
                  success:
                    type: boolean
                    description: 'true'
                    example: true
                  company:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Id
                        example: 1
                      name:
                        type: string
                        description: Name
                        example: Example Deductor Pvt Ltd
                      tan:
                        type: string
                        description: TAN
                        example: MUMB12345E
                  count:
                    type: integer
                    description: Total matching (before paging)
                    example: 1
                  skip:
                    type: integer
                    description: Offset
                    example: 0
                  take:
                    type: integer
                    description: Page size
                    example: 1000
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/TldcRecord'
                    description: Certificates
              examples:
                example1:
                  summary: Certificates
                  value:
                    success: true
                    company:
                      id: 1
                      name: Example Deductor Pvt Ltd
                      tan: MUMB12345E
                    count: 1
