                  oldActMissing:
                    type: integer
                    description: Old Act
                    example: 3
                  newActMissing:
                    type: integer
                    description: New Act
                    example: 0
                  downloaded:
                    type: object
                    properties:
                      old:
                        $ref: '#/components/schemas/MissingPdfResult'
                        nullable: true
                      new:
                        $ref: '#/components/schemas/MissingPdfResult'
                        nullable: true
                  listExcelPath:
                    type: string
                    description: List Excel used
                    example: ...
                  message:
                    type: string
                    description: Present when no rows in FYs
