  /api/challan/create:
    post:
      tags:
        - Challan payment
      summary: Create challans
      description: >-
        **Create ITNS 281 challans on the Income Tax e-Pay portal and return the PRN per section**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        sectionCode is the code from the section list (old Act e.g. 92B, 94C, 94J; new Act e.g. 1001, 1027 with actType "new"). New-Act
        sections are combined into one challan by default. Payment itself is completed by the user against the PRN (net banking / bank).
        HTTP 200 is returned even when some sections fail; check each result.
      operationId: createChallans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyId
                - assessmentYear
                - sections
              properties:
                companyId:
                  type: integer
                  description: Company id
                  example: 1
                assessmentYear:
                  type: string
                  description: Assessment / tax year
                  example: 2027-28
                sections:
                  type: array
                  items:
                    type: object
                    required:
                      - sectionCode
                      - amount
                    properties:
                      sectionCode:
                        type: string
                        description: Section code from the section list
                        example: 94C
                      amount:
                        type: string
                        description: Amount (INR)
                        example: '25000'
                      actType:
                        type: string
                        description: old (default) or new
                        example: old
                        enum:
                          - old
                          - new
                  description: One entry per section
                  minItems: 1
                newRegimeChallanMode:
                  type: string
                  description: 'combined (default): one challan for all new-Act sections; separate: one per section'
                  example: combined
                  enum:
                    - combined
                    - separate
                skipDownload:
                  type: boolean
                  description: false (default) downloads the created challan PDFs afterwards
                  example: true
            examples:
              example1:
                summary: Create challans
                value:
                  companyId: 1
                  assessmentYear: 2027-28
                  skipDownload: true
                  sections:
                    - sectionCode: 94C
                      amount: '25000'
                      actType: old
                    - sectionCode: '1027'
                      amount: '50000'
                      actType: new
      responses:
        '200':
          description: Per-section results (new-Act results first)
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - results
                properties:
                  success:
                    type: boolean
                    description: 'true'
                    example: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChallanCreateResult'
                    description: Per section
              examples:
                example1:
                  summary: Per-section results (new-Act results first)
                  value:
                    success: true
                    results:
                      - sectionCode: '1027'
                        sectionDesc: '393(1) [Table: Sl. No. 6(iii).D(b)]'
                        amount: '50000'
                        success: true
                        pymntRefNum: '26041500012346'
                      - sectionCode: 94C
                        sectionDesc: 194C
                        amount: '25000'
                        success: true
                        pymntRefNum: '26041500012345'
        '400':
          description: Missing fields, or duplicate new-Act section in combined mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Missing fields, or duplicate new-Act section in combined mode
                  value:
                    error: Missing required fields
        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Missing or invalid API token
                  value:
                    error: Unauthorized
        '404':
          description: Unknown companyId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Unknown companyId
                  value:
                    error: Company not found
        '405':
          description: Wrong HTTP method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Wrong HTTP method
                  value:
                    error: Method not allowed
        '500':
          description: Portal automation or server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              examples:
                example1:
                  summary: Portal automation or server failure
                  value:
                    error: 'Login failed: invalid credentials'
