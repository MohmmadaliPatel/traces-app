  /api/challan/download-pdfs-from-uploaded-excels:
    post:
      tags:
        - Import challans
      summary: Download receipts for uploaded rows
      description: >-
        **Download payment receipts for rows (TAN + deposit date) taken from your own Excel**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        Rows are grouped by TAN; each TAN's date range (min-1 to max+1 day) is downloaded per Act. HTTP 200 even if every TAN fails; check
        results.
      operationId: downloadReceiptsForUploadedRows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rows
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    required:
                      - tan
                      - dateOfDeposit
                    properties:
                      tan:
                        type: string
                        description: TAN of a company in the system
                        example: MUMB12345E
                      dateOfDeposit:
                        type: string
                        description: DD-Mon-YYYY
                        example: 07-Jun-2025
                      challanAmount:
                        oneOf:
                          - type: string
                          - type: number
                        description: Not used
                        example: 25000
                      companyName:
                        type: string
                        description: Used in error messages
                        example: Example Deductor Pvt Ltd
                  description: Rows
                  minItems: 1
            examples:
              example1:
                summary: Download receipts for uploaded rows
                value:
                  rows:
                    - tan: MUMB12345E
                      dateOfDeposit: 07-Jun-2025
                      challanAmount: 25000
                      companyName: Example Deductor Pvt Ltd
      responses:
        '200':
          description: Per-TAN results
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - results
                properties:
                  success:
                    type: boolean
                    description: true if at least one TAN succeeded
                    example: true
                  companies:
                    type: integer
                    description: Distinct TANs
                    example: 1
                  successCount:
                    type: integer
                    description: Succeeded
                    example: 1
                  failedCount:
                    type: integer
                    description: Failed
                    example: 0
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        tan:
                          type: string
                          description: TAN
                          example: MUMB12345E
                        companyName:
                          type: string
                          description: Company
                          example: Example Deductor Pvt Ltd
                        success:
                          type: boolean
                          description: Succeeded
                          example: true
                        error:
                          type: string
                          description: Failure reason
                        rowCount:
                          type: integer
                          description: Rows
                          example: 1
                        fromDate:
                          type: string
                          description: Range from
                          example: 06-Jun-2025 00:00:00
                        toDate:
                          type: string
                          description: Range to
                          example: 08-Jun-2025 23:59:59
                        acts:
                          type: array
                          items:
                            type: string
                          description: Acts processed
                        downloaded:
                          type: array
                          items:
                            type: object
                            properties:
                              act:
                                type: string
                                description: old/new
                                example: old
                              fromDate:
                                type: string
                                description: From
                                example: 06-Jun-2025 00:00:00
                              toDate:
                                type: string
                                description: To
                                example: 08-Jun-2025 23:59:59
                              rowCount:
                                type: integer
                                description: Rows
                                example: 1
                              downloaded:
                                $ref: '#/components/schemas/DownloadStats'
                          description: Per Act
                    description: Per TAN
              examples:
                example1:
                  summary: Per-TAN results
                  value:
                    success: true
                    companies: 1
                    successCount: 1
                    failedCount: 0
                    results:
                      - tan: MUMB12345E
                        companyName: Example Deductor Pvt Ltd
                        success: true
                        rowCount: 1
                        fromDate: 06-Jun-2025 00:00:00
                        toDate: 08-Jun-2025 23:59:59
                        acts:
                          - old
                        downloaded:
                          - act: old
                            fromDate: 06-Jun-2025 00:00:00
                            toDate: 08-Jun-2025 23:59:59
                            rowCount: 1
                            downloaded:
