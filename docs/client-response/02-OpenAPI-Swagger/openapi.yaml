        Mode: Database read.


        Public. Creates a browser session (cookies) and returns an `anti-csrf` response header. The session is only needed to call
        createApiToken; use the API token for everything else. Wrong email or password returns an AuthenticationError in the RPC envelope.


        RPC call: body is { "params": {...}, "meta": {} }. Success is { "result": ..., "error": null }. Resolver errors (validation, not
        found, not logged in) also return HTTP 200 with "result": null and an "error" object; check "error" on every response.
      operationId: loginSession
      security: []
      requestBody:
