                        type: array
                        items:
                          type: object
                          properties:
                            certNumber:
                              type: string
                              description: Cert no.
                              example: 1234567890ABC
                            pan:
                              type: string
                              description: PAN
                              example: ABCDE1234F
                            din:
                              type: string
                              description: DIN
                              example: DIN0001
                            fy:
                              type: string
                              description: FY
                              example: 2024-25
                            pdfPath:
                              type: string
                              description: Kept PDF (relative to public/)
                              example: pdf/tldc-downloads/certificates/1234567890ABC.pdf
                              nullable: true
                        description: Raw rows read from the 197 inbox
                  cached:
                    type: boolean
                    description: Always false
                    example: false
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/TldcRecord'
                    description: Certificates saved in this run
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/TldcWarning'
                    description: Per-certificate problems
                  message:
                    type: string
                    description: Summary
                    example: Successfully fetched TLDC data
              examples:
                example1:
                  summary: Fetched and saved
                  value:
                    success: true
                    data:
                      success: true
