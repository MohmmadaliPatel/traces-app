  /api/rpc/processExcelUploadChallanStatus:
    post:
      tags:
        - Import challans
      summary: Unconsumed challans - batch
      description: >-
        **Queue unconsumed-challan reads for many companies**


        Mode: Asynchronous (returns batchId).


        Asynchronous: returns a batchId immediately. Poll the Job monitoring calls (or the conso progress stream) until every task is
        Finished or Failed, then download files with GET /api/file/{path}. One task per company.


        RPC call: body is { "params": {...}, "meta": {} }. Success is { "result": ..., "error": null }. Resolver errors (validation, not
        found, not logged in) also return HTTP 200 with "result": null and an "error" object; check "error" on every response.
      operationId: unconsumedChallansBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - params
              properties:
                params:
                  type: object
                  required:
                    - companies
                    - financialYear
                    - quarter
                    - actionType
                    - jobTypes
                  properties:
                    companies:
                      type: array
                      items:
                        $ref: '#/components/schemas/CompanyCredentials'
                      description: Companies
                    financialYear:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      description: Deposit-date FY(s); "" = all
                      example: ''
                    quarter:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                      description: Required but not used; send ""
                      example: ''
                    actionType:
                      type: string
                      description: Send download_file
                      example: download_file
                      enum:
                        - send_request
                        - download_file
                    jobTypes:
                      type: array
                      items:
                        type: string
                      description: Send ["DownloadChallanStatus"]
                      example:
                        - DownloadChallanStatus
                    challanStatusType:
                      type: string
                      description: Always challan_status
                      example: challan_status
                      enum:
                        - challan_status
                    onlyPaymentPdfNotInExcel:
                      type: boolean
                      description: Only challans not already in the Excel
                      example: true
                    mode:
                      type: string
                      description: list or full (default)
                      example: list
                      enum:
                        - list
                        - full
                meta:
                  type: object
                  description: Send {}
                  example: {}
            examples:
              example1:
                summary: Unconsumed challans - batch
                value:
                  params:
                    companies:
                      - name: Example Deductor Pvt Ltd
                        tan: MUMB12345E
                        it_password: '********'
                        user_id: MUMB12345E
                        password: '********'
                    financialYear: ''
                    quarter: ''
                    actionType: download_file
                    jobTypes:
                      - DownloadChallanStatus
                    challanStatusType: challan_status
                    onlyPaymentPdfNotInExcel: true
                    mode: list
                  meta: {}
      responses:
        '200':
          description: 'Success: result holds the data | Resolver error (still HTTP 200): result is null and error describes it'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - result
                      - error
                    properties:
                      result:
                        $ref: '#/components/schemas/BatchCreated'
                      error:
                        type: object
                        nullable: true
                        description: null on success
                        example: null
                      meta:
                        type: object
                        description: Serializer metadata; ignore
                  - $ref: '#/components/schemas/RpcErrorEnvelope'
              examples:
                success:
                  summary: Success
                  value:
                    result:
                      message: Companies added to queue successfully
                      batchId: 42
                      companyCount: 1
                      taskCount: 1
                    error: null
                error:
                  summary: Error
                  value:
                    result: null
                    error:
                      name: AuthenticationError
                      message: You must be logged in to access this
                      code: null
                      statusCode: 401
                      meta: null
                      url: null
        '401':
          description: Invalid or expired API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: Invalid or expired API token
                  value:
                    error: Unauthorized
        '403':
          description: Request blocked by the input-safety filter (script / HTML / CRLF patterns in the body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileError'
              examples:
                example1:
                  summary: Request blocked by the input-safety filter (script / HTML / CRLF patterns in the body)
                  value:
                    message: Invalid request body detected
  /api/challan/download-pdfs-from-unconsumed-excel:
