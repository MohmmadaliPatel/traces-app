  /api/challan/download-generated-challans:
    post:
      tags:
        - Challan payment
      summary: Download generated challans (filtered)
      description: >-
        **Download generated (unpaid) challans by date range, year or specific rows**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        Dates use the e-Pay format DD-Mon-YYYY (e.g. "01-Apr-2026"). With rowDownloadTargets, rows are matched on tax year + amount and the
        date filter is skipped. Files: public/pdf/challans/{Company}/GeneratedChallansFiltered/ plus an Excel summary.
      operationId: downloadGeneratedChallansFiltered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyId
              properties:
                companyId:
                  type: integer
                  description: Company id
                  example: 1
                fromDate:
                  type: string
                  description: From date DD-Mon-YYYY (used with toDate)
                  example: 01-Apr-2026
                toDate:
                  type: string
                  description: To date DD-Mon-YYYY
                  example: 31-Mar-2027
                assessmentYear:
                  type: string
                  description: Year filter
                  example: 2027-28
                paymentType:
                  type: string
                  description: Payment type filter
                  example: TDS/TCS Payable by Taxpayer(200)
                incomeTaxAct:
                  type: string
                  description: old (default) or new
                  example: new
                  enum:
                    - old
                    - new
                rowDownloadTargets:
                  type: array
                  items:
