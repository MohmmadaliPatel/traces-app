        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TldcError'
              examples:
                example1:
                  summary: Unexpected server error
                  value:
                    success: false
                    errorCode: LDC_INTERNAL_ERROR
                    message: Unexpected error
                    retryable: true
        '502':
          description: Captcha not solved in 5 attempts, TRACES session ended (LDC_SESSION_EXPIRED) or PDF download failed (LDC_PDF_DOWNLOAD_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TldcError'
              examples:
                example1:
                  summary: >-
                    Captcha not solved in 5 attempts, TRACES session ended (LDC_SESSION_EXPIRED) or PDF download failed
                    (LDC_PDF_DOWNLOAD_FAILED)
                  value:
                    success: false
                    errorCode: LDC_CAPTCHA_FAILED
                    message: 'TRACES login failed after 5 attempts: CPT403 ...'
                    retryable: true
        '503':
          description: TRACES or captcha service unavailable (LDC_PORTAL_UNAVAILABLE / LDC_CAPTCHA_SERVICE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TldcError'
              examples:
                example1:
                  summary: TRACES or captcha service unavailable (LDC_PORTAL_UNAVAILABLE / LDC_CAPTCHA_SERVICE_UNAVAILABLE)
                  value:
                    success: false
                    errorCode: LDC_PORTAL_UNAVAILABLE
                    message: 'searchDeductor HTTP 503: ...'
                    retryable: true
        '504':
          description: TRACES did not respond in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TldcError'
              examples:
                example1:
                  summary: TRACES did not respond in time
                  value:
                    success: false
                    errorCode: LDC_TIMEOUT
                    message: 'TimeoutError: Navigation timeout of 30000 ms exceeded'
                    retryable: true
