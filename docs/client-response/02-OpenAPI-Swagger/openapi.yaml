  /api/challan/run-challan-status:
    post:
      tags:
        - Import challans
      summary: Unconsumed challans
      description: >-
        **Read TRACES unconsumed challans for one company (list, or full with unconsumed amounts)**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        mode "list": reads the TRACES unconsumed-challan grid into an Excel. mode "full" (default): also reveals each unconsumed amount
        ("View Amount") and builds the challan-status Excel. Uses the TRACES credentials stored on the company. financialYears filters by
        deposit date FY ("2025-26").
      operationId: unconsumedChallans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyId
              properties:
                companyId:
                  type: integer
                  description: Company id
                  example: 1
                mode:
                  type: string
                  description: list or full (default)
                  example: list
                  enum:
                    - list
                    - full
                financialYears:
                  type: array
                  items:
                    type: string
                  description: Deposit-date FYs (default all)
                  example:
                    - 2025-26
                onlyPaymentPdfNotInExcel:
                  type: boolean
                  description: 'full mode: only challans not already in the Excel (default true)'
                  example: true
            examples:
              example1:
                summary: Unconsumed challans - list
                value:
                  companyId: 1
                  mode: list
                  financialYears:
                    - 2025-26
              example2:
                summary: Unconsumed challans - full (with amounts)
                value:
                  companyId: 1
                  mode: full
                  onlyPaymentPdfNotInExcel: true
                  financialYears:
                    - 2025-26
      responses:
        '200':
          description: Completed. details shape depends on mode.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - status
                  - details
                properties:
                  success:
                    type: boolean
                    description: true when completed
                    example: true
                  status:
                    type: string
                    description: Completed / Failed
                    example: Completed
                    enum:
                      - Completed
                      - Failed
                  companyName:
                    type: string
                    description: Company
                    example: Example Deductor Pvt Ltd
                  tan:
                    type: string
                    description: TAN
                    example: MUMB12345E
                  details:
                    oneOf:
                      - type: object
                        description: mode = list
                        required:
                          - mode
                          - rowsProcessed
                          - newRecords
                        properties:
                          success:
                            type: boolean
                            description: 'true'
                            example: true
                          mode:
                            type: string
                            description: list
                            example: list
                          company:
                            type: string
                            description: Company
                            example: Example Deductor Pvt Ltd
                          tan:
                            type: string
                            description: TAN
