        - Import challans
      summary: Download receipts for unconsumed challans
      description: >-
        **Download payment receipts for the challans in the unconsumed-challan list**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
