                      description: 'Prisma filter, e.g. { "companyId": 1, "finyear": "2025-26" }'
                    orderBy:
                      type: object
                    skip:
                      type: integer
                      description: Offset
                      example: 0
                    take:
                      type: integer
                      description: Page size
                      example: 100
                meta:
                  type: object
                  description: Send {}
                  example: {}
