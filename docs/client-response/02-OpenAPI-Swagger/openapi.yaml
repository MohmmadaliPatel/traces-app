  /api/tldc/fetch-data-new-act:
    post:
      tags:
        - LDC
      summary: Fetch certificates - New Act
      description: >-
        **Fetch LDC certificates from TRACES (Income-tax Act 2025, tax year 2026-27 onwards)**


        Mode: Synchronous (portal call).


        Synchronous: the HTTP call stays open until the portal work finishes (typically 1-10 minutes). Use a client timeout of at least 15
        minutes.


        Steps: TRACES login (captcha solved automatically) → search certificates → download ready PDFs → raise download requests for missing
        PDFs → read certificate details → save. Certificates whose PDF TRACES has not prepared yet are listed in data.missingCertNumbers
        (their rows are still saved; call again later to collect the PDFs). Saved on (companyId, certNumber, fy), so repeat calls never
        duplicate.
      operationId: fetchCertificatesNewAct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tan
                - fy
                - companyId
                - credentials
              properties:
                tan:
                  type: string
                  description: Deductor TAN
                  example: MUMB12345E
                fy:
                  type: string
                  description: 'Tax year: "2026-27", "2026" or "2026-2027"'
                  example: 2026-27
                companyId:
                  type: integer
                  description: Deductor company id
                  example: 1
                credentials:
                  $ref: '#/components/schemas/PortalCredentials'
                companyName:
                  type: string
                  description: Optional; folder name for PDFs (defaults to the company name)
                  example: Example Deductor Pvt Ltd
                initiateIfNoRequest:
                  type: boolean
                  description: Raise TRACES download requests only when none exist (default true)
                  example: true
                forceInitiate:
                  type: boolean
                  description: Raise download requests for all certificates (default false)
                  example: false
            examples:
              example1:
                summary: Fetch certificates - New Act
                value:
                  tan: MUMB12345E
                  fy: 2026-27
                  companyId: 1
                  initiateIfNoRequest: true
                  forceInitiate: false
                  credentials:
                    userId: MUMB12345E
                    password: '********'
                    tan: MUMB12345E
      responses:
        '200':
          description: Fetched and saved
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    description: 'true'
                    example: true
                  message:
                    type: string
                    description: Summary
                    example: 'New Act TLDC: 1 created, 0 updated, 0 missing in PDFs'
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
                        description: Rows created
                        example: 1
                      updated:
                        type: integer
                        description: Rows updated
                        example: 0
                      searchCount:
                        type: integer
                        description: Certificates found on TRACES
                        example: 1
                      downloadedPdfs:
                        type: integer
                        description: PDFs downloaded
                        example: 1
                      parsedPdfs:
                        type: array
                        items:
                          type: object
                          properties:
                            pdfPath:
                              type: string
                              description: Server path
                              example: ...
                            reqId:
                              type: string
                              description: TRACES request id
                              example: '298942'
                            certNumber:
                              type: string
                              description: Cert no. read from PDF
                              example: 4AD0426ILB4A140
                              nullable: true
                            pan:
                              type: string
                              description: PAN
                              example: ABCDE1234F
                              nullable: true
                            panName:
                              type: string
                              description: Name
                              example: EXAMPLE VENDOR LLP
                              nullable: true
                        description: PDFs read in this run
                      missingCertNumbers:
                        type: array
                        items:
                          type: string
                        description: Certificates whose PDF is not ready yet
                      initiated:
                        type: array
                        items:
                          type: object
                          properties:
                            childCertNum:
                              type: string
                              description: Cert no.
                              example: 4AD0426ILB4A141
                            requestId:
                              type: string
                              description: TRACES request id
                              example: '299001'
                            status:
                              type: string
                              description: Status
                              example: Submitted
                            error:
                              type: string
                              description: Error
                        description: Download requests raised
                      pdfDir:
                        type: string
                        description: Server folder of the PDFs
                        example: .../child-certificates/Example Deductor Pvt Ltd
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/TldcRecord'
                        description: Certificates saved in this run
                      warnings:
                        type: array
                        items:
                          $ref: '#/components/schemas/TldcWarning'
                        description: Per-certificate problems
              examples:
                example1:
                  summary: Fetched and saved
                  value:
                    success: true
                    message: 'New Act TLDC: 1 created, 0 updated, 0 missing in PDFs'
                    data:
                      created: 1
                      updated: 0
                      searchCount: 1
                      downloadedPdfs: 1
                      parsedPdfs:
                        - pdfPath: /srv/app/public/pdf/child-certificates/Example Deductor Pvt Ltd/298942.pdf
                          reqId: '298942'
                          certNumber: 4AD0426ILB4A140
                          pan: ABCDE1234F
                          panName: EXAMPLE VENDOR LLP
                      missingCertNumbers: []
                      initiated: []
                      pdfDir: /srv/app/public/pdf/child-certificates/Example Deductor Pvt Ltd
                      records:
                        - id: 11
                          companyId: 1
                          act: new
                          fy: 2026-27
                          certNumber: 4AD0426ILB4A140
                          din: 4AD0426ILB
                          pan: ABCDE1234F
                          panName: EXAMPLE VENDOR LLP
                          section: '1027'
                          sectionDesc: '393(1) [Table: Sl. No. 6(iii).D(b)]'
                          natureOfPayment: >-
                            Any sum by way of (a) fees for professional services; or (b) any sum referred to in section 26(2)(h) - other
                            than Specified person
                          tdsRate: 3
                          tdsAmountLimit: 900000
                          tdsAmountConsumed: 0
                          tdsAmountBalance: 900000
                          issueDate: 20-03-2026
                          validFrom: 24-04-2026
                          validTo: 31-03-2027
                          cancelDate: null
                          isActive: true
                          pdfUrl: /api/file/pdf/child-certificates/Example%20Deductor%20Pvt%20Ltd/298942.pdf
                          lastSyncedAt: '2026-07-30T11:05:36.144Z'
                      warnings: []
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TldcError'
              examples:
                example1:
                  summary: Invalid input
                  value:
                    success: false
                    errorCode: LDC_INVALID_INPUT
                    message: Missing required parameters (tan, fy, companyId, credentials)
                    retryable: false
        '401':
          description: 'TRACES rejected the credentials (an invalid API token returns { error: "Unauthorized" } instead) | Missing or invalid API token'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TldcError'
                  - $ref: '#/components/schemas/Unauthorized'
              examples:
                example1:
                  summary: 'TRACES rejected the credentials (an invalid API token returns { error: "Unauthorized" } instead)'
                  value:
                    success: false
                    errorCode: LDC_AUTH_INVALID
                    message: 'TRACES login failed (non-retryable): ... Invalid User ID / Password'
                    retryable: false
                example2:
                  summary: Missing or invalid API token
                  value:
